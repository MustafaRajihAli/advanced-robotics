amr:
  max_linear_speed_mps: 1.5
  max_angular_speed_radps: 1.2
  obstacle_safety_margin_m: 0.3
  fleet_size: 4

arm:
  dof: 6
  force_limit_n: 50.0
  torque_limit_nm: 20.0
  positioning_tolerance_mm: 1.0

vision:
  camera_ids: ["cam0", "cam1"]
  lidar_id: "lidar0"
  inference_backend: onnxruntime
  defect_confidence_threshold: 0.85

safety:
  estop_heartbeat_timeout_ms: 250
  watchdog_interval_ms: 50

integrations:
  erp_enabled: false
  mes_enabled: false
  scada_enabled: false

digital_twin:
  backend: gazebo
  world: warehouse_basic
